sync_address = ""
auto_sync = false

search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "directory"
style = "compact"
inline_height = 20
show_preview = true
max_preview_height = 4
preview_strategy = "auto"
exit_mode = "return-original"

show_help = true
invert = false

common_subcommands = [
  "git",
  "cargo",
  "npm",
  "yarn",
  "kubectl",
  "docker",
]

keymap_mode = "emacs"

history_filter = [
  "^ls$",
  "^cd$",
  "^pwd$",
  "^exit$",
]

enter_accept = true
update_check = false
